name: Feature request
description: Suggest a capability or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please read [ROADMAP.md](https://github.com/GyeongHoKim/copc-tileset/blob/trunk/ROADMAP.md)
        first — it states what this project is for and what it deliberately will
        not do. Proposals in the non-goals list are closed with a pointer there.

        Not sure whether an idea fits? Open a
        [Discussion](https://github.com/GyeongHoKim/copc-tileset/discussions)
        instead; it is a cheaper conversation than a rejected pull request.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >
        Describe the situation you are stuck in, not the solution. Real datasets,
        real sizes and real deployment constraints make the case far better than a
        hypothetical.
      placeholder: >
        Our scans are classified into 14 classes and we need to hide vegetation
        before the points reach the GPU, because …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the API or behaviour look like? A sketch is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        What did you try instead — a custom shader, a different SSE setting,
        preprocessing with PDAL? Why was it not enough?

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: >
            I read [ROADMAP.md](https://github.com/GyeongHoKim/copc-tileset/blob/trunk/ROADMAP.md)
            and this is not in the non-goals list.
          required: true
        - label: I searched existing issues and discussions for the same idea.
          required: true
        - label: >
            I agree to follow this project's
            [Code of Conduct](https://github.com/GyeongHoKim/copc-tileset/blob/trunk/CODE_OF_CONDUCT.md).
          required: true

  - type: dropdown
    id: contribution
    attributes:
      label: Would you be willing to work on this?
      options:
        - "Yes, I can open a pull request"
        - "Yes, with some guidance"
        - "No, but I can test it"
        - "No"
    validations:
      required: true
