name: Security

# Consumes the SBOMs generated by `npm run sbom` (see SBOM.md) and reports
# vulnerabilities to the repository's Security > Code scanning tab.

on:
  push:
    branches: [trunk]
  pull_request:
  schedule:
    # Weekly, so newly disclosed advisories surface without a code change.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The runtime closure — what consumers actually install. A vulnerability here
  # ships to users, so it fails the build.
  runtime:
    name: OSV scan (runtime SBOM)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      matrix-property: "runtime-"
      fail-on-vuln: true
      # Scan the CycloneDX SBOM only. Passing the whole directory would also pick
      # up bom.spdx.json and triple-report the same findings.
      scan-args: |-
        --lockfile=./sbom/bom.cdx.json

  # The full build toolchain. Advisories here affect maintainers, not consumers,
  # so this reports to the Security tab without blocking.
  build-tree:
    name: OSV scan (build tree)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      matrix-property: "buildtree-"
      fail-on-vuln: false
      scan-args: |-
        --lockfile=./package-lock.json
